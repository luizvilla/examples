# NOTE: this is the only Kconfig switch in this repo that pulls in the
# ThingSet stack (it `select`s THINGSET/THINGSET_SDK/THINGSET_CAN together,
# there is no lighter serial-only switch).
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y

CONFIG_SHELL=y
# Help diminish the memory impact, but no more "select" command
CONFIG_SHELL_MINIMAL=n
# Avoid conflicts with ThingSet ? command
CONFIG_SHELL_WILDCARD=n
# Support `select thingset` to run ThingSet requests directly
CONFIG_SHELL_CMDS_SELECT=y

CONFIG_THINGSET=y
CONFIG_THINGSET_SDK=y
CONFIG_THINGSET_SHELL=y

# Remove monitoring messages from thingset.
CONFIG_THINGSET_SHELL_REPORTING=n
CONFIG_THINGSET_SHELL_CMD_BUF_SIZE=256

# Disable Zephyr logging to save flash and avoid flooding the shell.
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n

# Remove logging in Shell to avoid flooding it.
CONFIG_SHELL_LOG_BACKEND=n
