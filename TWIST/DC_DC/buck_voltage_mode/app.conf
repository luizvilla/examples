# Zephyr configuration of the mission firmware (merged into Core's prj.conf).
# Taken from OwnTech Core4, branch serial_thingset_example_modular.

# This is the only Kconfig switch in Core that pulls in the ThingSet stack
# (it selects THINGSET, THINGSET_SDK and THINGSET_CAN together; there is no
# lighter serial-only switch).
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y

CONFIG_SHELL=y
# Keep the "select" command, which runs ThingSet requests directly
CONFIG_SHELL_MINIMAL=n
# Avoid conflicts with the ThingSet "?" command
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_CMDS_SELECT=y

CONFIG_THINGSET=y
CONFIG_THINGSET_SDK=y
CONFIG_THINGSET_SHELL=y

# No periodic reports from ThingSet on the shell
CONFIG_THINGSET_SHELL_REPORTING=n
CONFIG_THINGSET_SHELL_CMD_BUF_SIZE=256

# No Zephyr logging: saves flash and keeps the shell readable
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=n
