# Data objects of the buck voltage-mode mission.
#
# Every value the firmware exchanges with the computer through ThingSet is
# declared here, once. tools/gen_data_objects.py turns this file into
# firmware/data_objects.h and firmware/data_objects.cpp: never edit those
# two files by hand. OwnStudio shows this file as the data object table.
#
# Naming follows ThingSet: an "r" prefix is read-only, a "w" prefix is
# writable, no prefix is a writable setting. The part after the last "_"
# is the unit, and must match "unit". Quote descriptions: inside { } a
# comma would otherwise end the description.

subset: SER            # ThingSet subset every object belongs to (serial)

groups:
  - name: Measurements
    id: 0x05
    objects:
      - {name: rV1Low_V,    id: 0x50, type: float, decimals: 2, unit: V,    variable: V1_low_value,  description: "Low-side voltage of leg 1"}
      - {name: rV2Low_V,    id: 0x51, type: float, decimals: 2, unit: V,    variable: V2_low_value,  description: "Low-side voltage of leg 2"}
      - {name: rVHigh_V,    id: 0x52, type: float, decimals: 2, unit: V,    variable: V_high,        description: "High-side voltage"}
      - {name: rI1Low_A,    id: 0x53, type: float, decimals: 2, unit: A,    variable: I1_low_value,  description: "Low-side current of leg 1"}
      - {name: rI2Low_A,    id: 0x54, type: float, decimals: 2, unit: A,    variable: I2_low_value,  description: "Low-side current of leg 2"}
      - {name: rIHigh_A,    id: 0x55, type: float, decimals: 2, unit: A,    variable: I_high,        description: "High-side current"}
      - {name: rTemp1_degC, id: 0x56, type: float, decimals: 1, unit: degC, variable: temp_1_value,  description: "Temperature of leg 1"}
      - {name: rTemp2_degC, id: 0x57, type: float, decimals: 1, unit: degC, variable: temp_2_value,  description: "Temperature of leg 2"}
      - {name: rDuty,       id: 0x5A, type: float, decimals: 4,             variable: duty_cycle,    description: "Duty cycle applied to both legs, 0 to 1"}

  - name: Converter
    id: 0x06
    objects:
      - {name: Mode,          id: 0x61, type: uint8,              variable: mode,              description: "0 idle (PWM off), 1 power (PWM on, PI running)"}
      - {name: wVoltageRef_V, id: 0x62, type: float, decimals: 2, unit: V, variable: voltage_reference, description: "Output voltage reference of the PI"}

  # The firmware scope (firmware/scope.cpp): the five channels below, recorded
  # every control period into a 1024-sample ring. Arm it, then write to
  # Converter: it keeps 20 % of the window from before that write. Read the
  # capture 64 values at a time: write wChunk, then read rData.
  - name: Scope
    id: 0x08
    callback: scope_thingset_callback
    objects:
      - {name: wArm,        id: 0x80, type: uint8,  variable: scope_arm,      description: "Write 1 to record from the next write to Converter, 2 to record now; reads back 0"}
      - {name: rState,      id: 0x81, type: uint8,  variable: scope_state,    description: "0 idle, 1 armed, 2 recording, 3 ready to read"}
      - {name: rLength,     id: 0x82, type: uint16, variable: scope_length,   description: "Samples per channel"}
      - {name: rPretrigger, id: 0x83, type: uint16, variable: scope_pretrigger, description: "Samples recorded before the trigger"}
      - {name: rPeriod_s,   id: 0x84, type: float, decimals: 6, unit: s, variable: scope_period, description: "Time between two samples"}
      - {name: rChannels,   id: 0x85, type: string, size: 64, variable: scope_channels, description: "Recorded data objects, comma-separated, in data order"}
      - {name: wChunk,      id: 0x86, type: uint16, variable: scope_chunk,    description: "Which 64 values rData holds: channel after channel, oldest sample first"}
      - {name: rData,       id: 0x87, type: float_array, size: 64, decimals: 3, variable: scope_data, description: "64 recorded values, selected by wChunk"}

  # Build identity: which sources this firmware was built from. Written by
  # tools/build_identity.py at build time; "unknown" when built without it.
  - name: Build
    id: 0x07
    objects:
      - {name: rCommit,     id: 0x70, type: string, size: 41, variable: build_commit,      description: "Git commit of the mission folder"}
      - {name: rDirty,      id: 0x71, type: bool,             variable: build_dirty,       description: "True if the sources differed from the commit"}
      - {name: rSourceHash, id: 0x72, type: string, size: 17, variable: build_source_hash, description: "Hash of firmware/ and data_objects.yaml, 16 hex digits"}
