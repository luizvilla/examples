# The validation catalogue of the buck voltage-mode mission: every test, defined once.
#
# OwnStudio's control center and Home's Verification layer are built from this
# file, the test records in records/ and tests/findings.yaml
# (python -m ownstudio_lab.testing . --html records/control-center.html).
#
# status is the implementation state (implemented | partial | planned | blocked),
# never a verdict: verdicts come from the records. target: pc | simulator | board.
# A test that verifies a requirement names it here, and requirements.yaml lists
# the test in verified_by; tests/test_catalogue.py checks both directions.

version: 1

tabs:
  - id: model
    title: Plant model
    question: "Does the plant model behave like the Twist? First against hand calculations, then against the board."
  - id: control
    title: Control law
    question: "Does control.cpp compute what the PI formula says, alone, on the PC?"
  - id: loop
    title: Closed loop
    question: "Does control.cpp hold the requirements, closed loop on the plant model (L1) and on the board (L2)?"
  - id: link
    title: Board link
    question: "Does the board run this mission's firmware, and do its data objects answer as declared?"

tests:
  # Plant model against hand calculations (plant/model_tests/run_model_tests.py)
  - {id: PM-01a, tab: model, level: model, target: simulator, status: implemented, title: "Mean LOW1 voltage at duty 0.3", criterion: "within 2 % of duty × V_HIGH"}
  - {id: PM-01b, tab: model, level: model, target: simulator, status: implemented, title: "Mean LOW1 voltage at duty 0.5", criterion: "within 2 % of duty × V_HIGH"}
  - {id: PM-02,  tab: model, level: model, target: simulator, status: implemented, title: "Inductor current ripple, peak to peak", criterion: "within 10 % of the analytic ripple"}
  - {id: PM-03,  tab: model, level: model, target: simulator, status: implemented, title: "LOW1 voltage ripple, peak to peak", criterion: "within 15 % of the analytic ripple"}
  - {id: PM-04,  tab: model, level: model, target: simulator, status: implemented, title: "Output filter resonance from start-up ringing", criterion: "within 5 % of 1/(2π√(LC))"}

  # Plant model against the board (tests/bench/bench_mod_01.py, operator at the bench)
  - id: BENCH-MOD-01
    tab: model
    level: bench
    target: board
    status: implemented
    title: "Steady state at 30 V in, 33 Ω on each leg, references 5, 8 and 12 V"
    criterion: "LOW1 by multimeter within 2 % of the reference; duty within 5 % of the plant model's; supply current within 15 % of the model's"
    notes: "Needs an operator: supply limited to 1 A, two 33 Ω loads, a multimeter. Sensor readings against the meter are information only."

  # Control law alone (tests/run_l0.sh)
  - {id: L0-CTL-01,  tab: control, level: L0, target: pc, status: implemented, title: "Zero error from reset gives duty 0", criterion: "duty = 0"}
  - {id: L0-CTL-02,  tab: control, level: L0, target: pc, status: implemented, title: "First step equals Kp·e·(1 + Ts/Ti)", criterion: "within 1e-6"}
  - {id: L0-CTL-03a, tab: control, level: L0, target: pc, status: implemented, title: "Duty never decreases under constant positive error", criterion: "monotonic"}
  - {id: L0-CTL-03b, tab: control, level: L0, target: pc, status: implemented, title: "Duty never exceeds 1", criterion: "≤ 1"}
  - {id: L0-CTL-03c, tab: control, level: L0, target: pc, status: implemented, title: "Duty saturates at the predicted step", criterion: "within one step"}
  - {id: L0-CTL-04,  tab: control, level: L0, target: pc, status: implemented, title: "No windup: one negative-error step leaves saturation", criterion: "within 1e-4 of 1 − Kp·(e + 1 + Ts/Ti)"}
  - {id: L0-CTL-05,  tab: control, level: L0, target: pc, status: implemented, title: "Large negative error gives duty 0", criterion: "duty = 0"}
  - {id: L0-CTL-06,  tab: control, level: L0, target: pc, status: implemented, title: "After reset the first step equals L0-CTL-02", criterion: "within 1e-6"}

  # Closed loop (tests/l1/run_l1.py on the simulator)
  - {id: BUCK-STEP-01a, tab: loop, level: L1, target: simulator, status: implemented, requirements: [REQ-VOUT], title: "Mean LOW1 voltage before the 1 A → 2 A load step", criterion: "within 2 % of 12 V"}
  - {id: BUCK-STEP-01b, tab: loop, level: L1, target: simulator, status: implemented, requirements: [REQ-UNDERSHOOT], title: "Lowest LOW1 voltage after the load step", criterion: "at least 95 % of 12 V"}
  - {id: BUCK-STEP-01c, tab: loop, level: L1, target: simulator, status: implemented, requirements: [REQ-SETTLING], title: "Settling back into ±2 % after the load step", criterion: "at most 10 ms, and settled by the end"}
  - {id: BUCK-STEP-01d, tab: loop, level: L1, target: simulator, status: implemented, requirements: [REQ-RIPPLE], title: "LOW1 ripple, peak to peak, before the step", criterion: "at most 100 mV"}
  - id: BUCK-STEP-02
    tab: loop
    level: L2
    target: board
    status: blocked
    blocked_by: "a switched load on the bench, and the firmware scope for the waveform (step 4)"
    title: "The 1 A → 2 A load step on the board"
    criterion: "the BUCK-STEP-01 criteria, measured on the board"

  # Board link (tests/l2/run_l2_link.py)
  - {id: LINK-01, tab: link, level: L2, target: board, status: implemented, title: "Board runs this mission's sources", criterion: "source hash equal"}
  - {id: LINK-02, tab: link, level: L2, target: board, status: implemented, title: "Every data object is on the board with its type", criterion: "missing or mistyped = 0"}
  - {id: LINK-03, tab: link, level: L2, target: board, status: implemented, title: "No two root objects share a name", criterion: "duplicates = 0"}
  - {id: LINK-04, tab: link, level: L2, target: board, status: implemented, title: "A written reference reads back", criterion: "|readback − written| < 0.01 V"}
  - {id: LINK-05, tab: link, level: L2, target: board, status: implemented, title: "The converter is idle", criterion: "Mode = 0 (PWM off)"}
  - {id: LINK-06, tab: link, level: L2, target: board, status: implemented, title: "A read-only object refuses writes", criterion: "answer is :A3 Forbidden"}
